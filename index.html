<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>your profile</h1>
    <div id="container">
    <textarea name="text" id="text" cols="30" rows="10" ></textarea></div>
<button id="btn" onclick="myFunction()" >add more</button>
<script>
function myFunction(){
    let newTextarea = document.createElement("textarea");
    newTextarea.name = "text";
            newTextarea.cols = 30;
            newTextarea.rows = 10;

    document.getElementById("container").appendChild(newTextarea);
    
}
</script>

</body>
</html>
